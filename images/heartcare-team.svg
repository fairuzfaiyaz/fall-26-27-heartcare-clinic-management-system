<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HeartCare team. Fairuz Faiyaz, Administrator, github fairuzfaiyaz. Nazibha Tabassum, Patient, github Nazibha. Aurpita Roy Sreya, Laboratory Technician, github aurpitaroy. Badhon Pal, Doctor, github BadhonPal.">
  <defs>
