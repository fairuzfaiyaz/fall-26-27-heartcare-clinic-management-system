<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One login page redirects by role: admin to dashboard.php, doctor to doctor-dashboard.php, patient to patient-dashboard.php, labtech to lab-dashboard.php. Five failed attempts lock the form for 30 seconds.">
  <defs>
    <pattern id="l_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="l_glow" cx="12%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l_btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <path id="l_p1" d="M 360,287 L 564,287 C 660,287 660,152 760,152"/>
    <path id="l_p2" d="M 360,287 L 564,287 C 660,287 660,242 760,242"/>
    <path id="l_p3" d="M 360,287 L 564,287 C 660,287 660,332 760,332"/>
    <path id="l_p4" d="M 360,287 L 564,287 C 660,287 660,422 760,422"/>
  </defs>

  <rect width="1200" height="560" fill="#0b0e14"/>
  <rect width="1200" height="560" fill="url(#l_grid)"/>
  <rect width="1200" height="560" fill="url(#l_glow)"/>

  <text x="60" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.5" fill="#fb7185">ONE LOGIN &#183; <tspan fill="#67e8f9">ROLE-BASED REDIRECT</tspan></text>
  <text x="60" y="88" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#a1a1aa">The role stored in the account decides which dashboard opens.</text>

  <!-- login card -->
  <rect x="60" y="157" width="300" height="260" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="84" y="196" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#e9edf3">Sign In</text>
  <rect x="84" y="212" width="252" height="32" rx="6" fill="#0b0e14" stroke="#3b4252"/>
  <text x="96" y="233" font-family="Consolas, monospace" font-size="12" fill="#71717a">name@heartcare.com</text>
  <rect x="84" y="256" width="252" height="32" rx="6" fill="#0b0e14" stroke="#3b4252"/>
  <text x="96" y="277" font-family="Consolas, monospace" font-size="12" fill="#71717a">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
  <rect x="84" y="304" width="252" height="36" rx="8" fill="url(#l_btn)">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="210" y="327" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Sign In</text>
  <text x="84" y="366" font-family="Consolas, monospace" font-size="10.5" fill="#fbbf24">5 failed attempts = 30 s lock</text>
  <text x="84" y="386" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">show/hide &#183; caps lock &#183; remember me</text>
  <text x="84" y="404" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">inactive account check</text>

  <!-- static connectors -->
  <line x1="360" y1="287" x2="476" y2="287" stroke="#3b4252" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="none" stroke="#3b4252" stroke-width="2" stroke-dasharray="5 5">
    <path d="M 564,287 C 660,287 660,152 760,152"/>
    <path d="M 564,287 C 660,287 660,242 760,242"/>
    <path d="M 564,287 C 660,287 660,332 760,332"/>
    <path d="M 564,287 C 660,287 660,422 760,422"/>
  </g>

  <!-- switch node -->
  <circle cx="520" cy="287" r="44" fill="#161b22" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="520" y="283" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#fde68a">switch</text>
  <text x="520" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#fde68a">(role)</text>

  <!-- dashboard cards -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="760" y="120" width="380" height="64" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.22;0.27;0.45;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="784" y="147" font-size="16" font-weight="800" fill="#e9edf3">Administrator</text>
    <text x="784" y="167" font-family="Consolas, monospace" font-size="11.5" fill="#c4b5fd">admin &#8594; dashboard.php</text>

    <rect x="760" y="210" width="380" height="64" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.22;0.27;0.45;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="784" y="237" font-size="16" font-weight="800" fill="#e9edf3">Doctor</text>
    <text x="784" y="257" font-family="Consolas, monospace" font-size="11.5" fill="#7dd3fc">doctor &#8594; doctor-dashboard.php</text>

    <rect x="760" y="300" width="380" height="64" rx="12" fill="#161b22" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.22;0.27;0.45;1" dur="8s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="784" y="327" font-size="16" font-weight="800" fill="#e9edf3">Patient</text>
    <text x="784" y="347" font-family="Consolas, monospace" font-size="11.5" fill="#f9a8d4">patient &#8594; patient-dashboard.php</text>

    <rect x="760" y="390" width="380" height="64" rx="12" fill="#161b22" stroke="#7ee787" stroke-width="1.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.22;0.27;0.45;1" dur="8s" begin="6s" repeatCount="indefinite"/>
    </rect>
    <text x="784" y="417" font-size="16" font-weight="800" fill="#e9edf3">Laboratory Technician</text>
    <text x="784" y="437" font-family="Consolas, monospace" font-size="11.5" fill="#86efac">labtech &#8594; lab-dashboard.php</text>
  </g>

  <!-- traveling dots, one role at a time -->
  <circle r="6" fill="#a78bfa" opacity="0">
    <animateMotion dur="8s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#l_p1"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" dur="8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#38bdf8" opacity="0">
    <animateMotion dur="8s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#l_p2"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" dur="8s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#f472b6" opacity="0">
    <animateMotion dur="8s" begin="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#l_p3"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" dur="8s" begin="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#7ee787" opacity="0">
    <animateMotion dur="8s" begin="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#l_p4"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" dur="8s" begin="6s" repeatCount="indefinite"/>
  </circle>

  <rect x="60" y="486" width="1080" height="42" rx="12" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="84" y="512" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9"><tspan font-weight="700" fill="#fb7185">Demo only:</tspan> accounts live in js/login-data.js. Passwords are not securely stored in this frontend prototype.</text>
</svg>