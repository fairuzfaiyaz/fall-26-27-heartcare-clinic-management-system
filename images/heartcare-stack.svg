<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack. HTML5 for pages and forms, CSS3 for responsive UI, JavaScript for validation and DOM manipulation. Scripts load in order: data file, common.js, page script. No framework, no chart library.">
  <defs>
    <pattern id="s_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="s_glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s_brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <path id="s_flow" d="M 210,400 L 990,400"/>
  </defs>

  <rect width="1200" height="560" fill="#0b0e14"/>
  <rect width="1200" height="560" fill="url(#s_grid)"/>
  <rect width="1200" height="560" fill="url(#s_glow)"/>

  <text x="60" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.5" fill="#fb7185">TECH STACK &#183; <tspan fill="#67e8f9">HTML / CSS / JS SEPARATION</tspan></text>

  <!-- three columns -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="60" y="84" width="340" height="200" rx="14" fill="#161b22" stroke="#fb923c" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="84" y="120" font-size="22" font-weight="800" fill="#fdba74">HTML5</text>
    <text x="84" y="142" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#71717a">PAGES &amp; FORMS</text>
    <text font-size="13" fill="#a1a1aa"><tspan x="84" y="176">&#8250; semantic layout and navigation</tspan><tspan x="84" y="198">&#8250; forms, tables, dialog modals</tspan><tspan x="84" y="220">&#8250; login, register, 4 dashboards</tspan></text>
    <rect x="84" y="250" width="0" height="4" rx="2" fill="#fb923c"><animate attributeName="width" values="0;292;292;0" keyTimes="0;0.4;0.9;1" dur="5s" repeatCount="indefinite"/></rect>

    <rect x="430" y="84" width="340" height="200" rx="14" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="454" y="120" font-size="22" font-weight="800" fill="#7dd3fc">CSS3</text>
    <text x="454" y="142" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#71717a">UI DESIGN</text>
    <text font-size="13" fill="#a1a1aa"><tspan x="454" y="176">&#8250; responsive grids and cards</tspan><tspan x="454" y="198">&#8250; sidebars and status badges</tspan><tspan x="454" y="220">&#8250; print styles for reports</tspan></text>
    <rect x="454" y="250" width="0" height="4" rx="2" fill="#38bdf8"><animate attributeName="width" values="0;292;292;0" keyTimes="0;0.4;0.9;1" dur="5s" begin="0.6s" repeatCount="indefinite"/></rect>

    <rect x="800" y="84" width="340" height="200" rx="14" fill="#161b22" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="824" y="120" font-size="22" font-weight="800" fill="#fde68a">JavaScript</text>
    <text x="824" y="142" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#71717a">BEHAVIOR &amp; DATA</text>
    <text font-size="13" fill="#a1a1aa"><tspan x="824" y="176">&#8250; validation and DOM updates</tspan><tspan x="824" y="198">&#8250; arrays of objects as sample data</tspan><tspan x="824" y="220">&#8250; search, filter, pagination</tspan></text>
    <rect x="824" y="250" width="0" height="4" rx="2" fill="#fbbf24"><animate attributeName="width" values="0;292;292;0" keyTimes="0;0.4;0.9;1" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- script load order -->
  <text x="60" y="334" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#71717a">SCRIPT LOAD ORDER (END OF BODY)</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="60" y="370" width="300" height="60" rx="12" fill="#161b22" stroke="#7ee787" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="210" y="395" fill="#bbf7d0">1. data file</text><text x="210" y="415" font-size="10.5" font-weight="400" fill="#71717a">e.g. login-data.js</text>
    <rect x="450" y="370" width="300" height="60" rx="12" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="600" y="395" fill="#bae6fd">2. common.js</text><text x="600" y="415" font-size="10.5" font-weight="400" fill="#71717a">shared helpers</text>
    <rect x="840" y="370" width="300" height="60" rx="12" fill="#161b22" stroke="#f472b6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="990" y="395" fill="#fbcfe8">3. page script</text><text x="990" y="415" font-size="10.5" font-weight="400" fill="#71717a">page logic</text>
  </g>
  <line x1="360" y1="400" x2="450" y2="400" stroke="#3b4252" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="750" y1="400" x2="840" y2="400" stroke="#3b4252" stroke-width="2" stroke-dasharray="5 5"/>
  <circle r="6" fill="url(#s_brand)">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#s_flow"/></animateMotion>
  </circle>

  <!-- chips -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="462" width="200" height="52" rx="12" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="160" y="485" font-size="16" font-weight="800" fill="#67e8f9">4</text><text x="160" y="504" font-size="10.5" fill="#a1a1aa">ROLE DASHBOARDS</text>
    <rect x="280" y="462" width="200" height="52" rx="12" fill="#161b22" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="380" y="485" font-size="16" font-weight="800" fill="#7ee787">0</text><text x="380" y="504" font-size="10.5" fill="#a1a1aa">FRAMEWORKS</text>
    <rect x="500" y="462" width="200" height="52" rx="12" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="600" y="485" font-size="16" font-weight="800" fill="#c4b5fd">0</text><text x="600" y="504" font-size="10.5" fill="#a1a1aa">CHART LIBRARIES</text>
    <rect x="720" y="462" width="200" height="52" rx="12" fill="#161b22" stroke="#fdcb6e" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="820" y="485" font-size="16" font-weight="800" fill="#fdcb6e">localStorage</text><text x="820" y="504" font-size="10.5" fill="#a1a1aa">LOGIN EMAIL ONLY</text>
    <rect x="940" y="462" width="200" height="52" rx="12" fill="#161b22" stroke="#f472b6" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="1040" y="485" font-size="16" font-weight="800" fill="#f472b6">PRINT / PDF</text><text x="1040" y="504" font-size="10.5" fill="#a1a1aa">BROWSER DIALOG</text>
  </g>
</svg>